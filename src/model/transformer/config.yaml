# config.yaml
data:
  csv_path: "../../../data/processed_data/dataset.csv"
  feature_cols:
    - barometer
    - temperature
    - wind_speed
    - rain_rate
  target_cols:
    - rain_rate
  input_window: 12 # steps
  output_window: 6 # steps

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 20
  device: "cpu"
  rounds: 25

model:
  input_dim: 6 
  output_dim: 1           
  d_model: 64             
  nhead: 4
  num_layers: 2
  dropout: 0.1
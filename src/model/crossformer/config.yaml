# config.yaml
data:
  csv_path: "../../../data/processed_data/dataset.csv"
  feature_cols:
    - station_id
    - temperature
    - humidity
    - wind_speed
    - wind_sin
    - wind_cos
  target_cols:
    - temperature
  input_window: 20 # hours
  output_window: 2 # hours

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 25
  device: "cpu"
  rounds: 20

model:
  input_dim: 6
  output_dim: 1           
  d_model: 64             
  nhead: 4
  num_layers: 2
  dropout: 0.1